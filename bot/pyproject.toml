[project]
name = "wisp-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=21.0,<23"]

[project.scripts]
wisp-bot = "wisp_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisp_bot"]
