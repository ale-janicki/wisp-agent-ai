name: windows

on:
  push:
    branches: [feat/windows-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen

      - name: Windows-safe tests
        shell: bash
        run: >-
          uv run pytest -q -p no:warnings
          cli/tests/test_compat.py
          cli/tests/test_serve_app.py cli/tests/test_serve_decoder.py cli/tests/test_serve_store.py
          cli/tests/test_serve_guards.py
          cli/tests/test_paths.py
          cli/tests/test_setup_shim.py
          cli/tests/test_serve_features.py
          cli/tests/test_serve_feature_brain_vault.py cli/tests/test_serve_feature_brain_drawing.py
          cli/tests/test_serve_feature_brain_routes.py cli/tests/test_serve_feature_tasks.py
          cli/tests/test_serve_tab_home.py cli/tests/test_serve_tab_agenda.py cli/tests/test_serve_tab_clipboard.py
          cli/tests/test_serve_tab_music.py cli/tests/test_serve_tab_mymac.py cli/tests/test_serve_tab_home_usage.py
          cli/tests/test_serve_tab_oauth.py cli/tests/test_serve_tab_quick.py
          cli/tests/test_doctor_windows.py
          cli/tests/test_settings_automations.py
          cli/tests/test_settings_feature.py
          cli/tests/test_settings_updates.py
          cli/tests/test_setup_windows.py
          cli/tests/test_taskscheduler.py
          bot/tests/test_config.py

      - name: Full suite (informational)
        continue-on-error: true
        run: uv run pytest -q -p no:warnings

  app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: win/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch the pinned uv.exe
        shell: bash
        env:
          WISP_UV_DEST: win/src-tauri/resources
        run: bash scripts/fetch-uv-windows.sh

      - name: Install frontend dependencies
        working-directory: win
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test the frontend
        working-directory: win
        run: |
          pnpm tsc --noEmit
          pnpm test

      - name: Build the Excalidraw editor for the Brain tab
        working-directory: app/Web/excalidraw
        run: |
          npm ci --ignore-scripts
          npx vite build --base ./

      - name: Build the NSIS installer
        working-directory: win
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Wisp-windows-setup
          path: win/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
