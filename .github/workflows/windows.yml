name: windows

on:
  push:
    branches: [feat/windows-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen

      - name: Windows-safe tests
        shell: bash
        run: >-
          uv run pytest -q -p no:warnings
          cli/tests/test_compat.py
          cli/tests/test_serve_app.py cli/tests/test_serve_decoder.py cli/tests/test_serve_store.py
          cli/tests/test_serve_guards.py
          cli/tests/test_paths.py
          cli/tests/test_setup_shim.py
          cli/tests/test_serve_features.py
          cli/tests/test_serve_feature_brain_vault.py cli/tests/test_serve_feature_brain_drawing.py
          cli/tests/test_serve_feature_brain_routes.py cli/tests/test_serve_feature_tasks.py
          cli/tests/test_serve_tab_home.py cli/tests/test_serve_tab_agenda.py cli/tests/test_serve_tab_clipboard.py
          cli/tests/test_serve_tab_music.py cli/tests/test_serve_tab_mymac.py cli/tests/test_serve_tab_home_usage.py
          cli/tests/test_serve_tab_oauth.py cli/tests/test_serve_tab_quick.py
          cli/tests/test_doctor_windows.py
          cli/tests/test_settings_automations.py
          cli/tests/test_settings_feature.py
          cli/tests/test_settings_updates.py
          cli/tests/test_setup_windows.py
          cli/tests/test_taskscheduler.py
          cli/tests/test_agent_launch.py
          cli/tests/test_meetings_win_asr.py
          cli/tests/test_meetings_win_audio.py
          cli/tests/test_meetings_win_capture.py
          cli/tests/test_meetings_win_compat.py
          cli/tests/test_meetings_win_copilot.py
          cli/tests/test_meetings_win_insights.py
          cli/tests/test_meetings_win_library.py
          cli/tests/test_meetings_win_live.py
          cli/tests/test_meetings_win_models.py
          cli/tests/test_meetings_win_pipeline.py
          cli/tests/test_meetings_win_recorder.py
          cli/tests/test_meetings_win_refine.py
          cli/tests/test_meetings_win_settings.py
          cli/tests/test_meetings_win_speech.py
          cli/tests/test_meetings_win_transcriber.py
          cli/tests/test_meetings_win_webhook.py
          cli/tests/test_meetings_win_winsys.py
          cli/tests/test_serve_meetings.py
          cli/tests/test_meetings_win_meta_race.py
          cli/tests/test_serve_token_isolation.py
          bot/tests/test_config.py

      - name: Full suite (informational)
        continue-on-error: true
        run: uv run pytest -q -p no:warnings

  app:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: win/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch the pinned uv.exe
        shell: bash
        env:
          WISP_UV_DEST: win/src-tauri/resources
        run: bash scripts/fetch-uv-windows.sh

      - name: Install frontend dependencies
        working-directory: win
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test the frontend
        working-directory: win
        run: |
          pnpm tsc --noEmit
          pnpm test

      - name: Build the Excalidraw editor for the Brain tab
        working-directory: app/Web/excalidraw
        run: |
          npm ci --ignore-scripts
          npx vite build --base ./

      - name: Build the NSIS installer
        working-directory: win
        run: pnpm tauri build --bundles nsis

      - name: First-run smoke test (installed app prepares its runtime)
        shell: pwsh
        run: |
          $setup = Get-ChildItem win/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Include 'Wisp.exe', 'wisp-win.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName
            throw 'installed app exe not found'
          }
          $log = Join-Path $env:LOCALAPPDATA 'wisp\logs\app.log'
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $deadline = (Get-Date).AddMinutes(15)
          $ok = $false
          $failed = $false
          try {
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $log) {
                $text = Get-Content $log -Raw
                if ($text -match 'sidecar ready on 127\.0\.0\.1:') { $ok = $true; break }
                if ($text -match 'sidecar failed:') { $failed = $true; break }
              }
              Start-Sleep -Seconds 5
            }
          } finally {
            if (Test-Path $log) { Get-Content $log }
            Get-Process -Name 'Wisp', 'wisp-win', 'wisp-serve' -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not $ok) { throw "sidecar did not become ready (failed=$failed)" }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Wisp-windows-setup
          path: win/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
