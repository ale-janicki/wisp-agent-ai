[package]
name = "wisp-win"
version = "0.1.0"
description = "Wisp for Windows: a pill that opens a chat panel, talking to the wisp-serve sidecar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wisp_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
