[project]
name = "wisp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "wisp-bot",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "winrt-runtime==4.2.1; sys_platform == 'win32'",
    "winrt-windows-media-control==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-foundation==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-foundation-collections==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-storage-streams==4!10.0.28000.2957; sys_platform == 'win32'",
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers==5.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
wisp = "wisp.cli:main"
wisp-serve = "wisp.serve.__main__:main"

[tool.uv.sources]
wisp-bot = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisp"]
