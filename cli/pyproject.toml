[project]
name = "wisp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "wisp-bot",
]

[project.scripts]
wisp = "wisp.cli:main"

[tool.uv.sources]
wisp-bot = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisp"]
