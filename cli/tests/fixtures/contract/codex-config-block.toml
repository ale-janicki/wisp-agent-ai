# wisp:begin
# Managed by Wisp. Edit outside this block; changes inside it are replaced on the next sync.
[mcp_servers.wisp-email]
command = "/opt/wisp/venv/bin/wisp"
args = ["mcp", "email"]
env_vars = ["WISP_TELEGRAM_THREAD", "WISP_APPROVAL_SOCKET"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 30
tool_timeout_sec = 660
[mcp_servers.wisp-brain]
command = "/opt/wisp/venv/bin/wisp"
args = ["mcp", "brain"]
env_vars = ["WISP_CONFIG", "XDG_CONFIG_HOME", "XDG_STATE_HOME"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 30
tool_timeout_sec = 60
# wisp:end
