name: Wisp
options:
  bundleIdPrefix: ai.wisp
  preGenCommand: ../scripts/build-excalidraw.sh --if-missing
  deploymentTarget:
    macOS: "15.0"
packages:
  WispCore:
    path: ../core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: e0c6103bc87a88d25276cad491c86e757f58c865
targets:
  wisp-agenda:
    type: tool
    platform: macOS
    sources:
      - Agenda
    dependencies:
      - package: WispCore
        product: WispCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: wisp-agenda
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.agenda
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ../scripts/agenda.entitlements
    info:
      path: Agenda/Info.plist
      properties:
        CFBundleName: wisp-agenda
        CFBundleIdentifier: ai.wisp.agenda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: "O Wisp lê e cria os compromissos da sua agenda quando você pede."
        NSRemindersFullAccessUsageDescription: "O Wisp lê e cria os seus lembretes quando você pede."
  wisp-mac:
    type: tool
    platform: macOS
    sources:
      - MacControl
    dependencies:
      - package: WispCore
        product: WispCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: wisp-mac
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.mac
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacControl/Info.plist
      properties:
        CFBundleName: wisp-mac
        CFBundleIdentifier: ai.wisp.mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  Wisp:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/ThirdParty
        type: folder
      - path: Resources/Excalidraw
        type: folder
      - Resources/Assets.xcassets
    dependencies:
      - package: WispCore
        product: WispCore
      - package: Sparkle
        product: Sparkle
      - package: FluidAudio
        product: FluidAudio
      - target: wisp-agenda
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: wisp-mac
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.app
        PRODUCT_NAME: Wisp
        MARKETING_VERSION: 0.4.4
        CURRENT_PROJECT_VERSION: 11
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed runtime
        script: '"$SRCROOT/../scripts/embed-runtime.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Wisp
        CFBundleDisplayName: Wisp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/ale-janicki/wisp-agent-ai/releases/latest/download/appcast.xml
        SUPublicEDKey: MNMKX6RjZ+MiJAkihRSLEqA+xZx5NA+yh22u8SIAr10=  # public EdDSA key, not a secret; gitleaks:allow
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: "O Wisp lê e cria os compromissos da sua agenda quando você pede."
        NSRemindersFullAccessUsageDescription: "O Wisp lê e cria os seus lembretes quando você pede."
        NSMicrophoneUsageDescription: "O Wisp grava o seu microfone quando você clica em gravar uma reunião."
        NSAudioCaptureUsageDescription: "O Wisp grava o áudio do Mac (a outra ponta da call) quando você clica em gravar uma reunião."
        NSAppleEventsUsageDescription: "O Wisp controla a música (Spotify, Music) e os apps do Mac, como o navegador, quando você pede."
