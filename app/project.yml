name: Wisp
options:
  bundleIdPrefix: ai.wisp
  deploymentTarget:
    macOS: "15.0"
packages:
  WispCore:
    path: ../core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  wisp-agenda:
    type: tool
    platform: macOS
    sources:
      - Agenda
    dependencies:
      - package: WispCore
        product: WispCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: wisp-agenda
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.agenda
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ../scripts/agenda.entitlements
    info:
      path: Agenda/Info.plist
      properties:
        CFBundleName: wisp-agenda
        CFBundleIdentifier: ai.wisp.agenda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: "O Wisp lê e cria os compromissos da sua agenda quando você pede."
        NSRemindersFullAccessUsageDescription: "O Wisp lê e cria os seus lembretes quando você pede."
  Wisp:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/ThirdParty
        type: folder
      - Resources/Assets.xcassets
    dependencies:
      - package: WispCore
        product: WispCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - target: wisp-agenda
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wisp.app
        PRODUCT_NAME: Wisp
        MARKETING_VERSION: 0.2.2
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed runtime
        script: '"$SRCROOT/../scripts/embed-runtime.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Wisp
        CFBundleDisplayName: Wisp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/ale-janicki/wisp-agent-ai/releases/latest/download/appcast.xml
        SUPublicEDKey: MNMKX6RjZ+MiJAkihRSLEqA+xZx5NA+yh22u8SIAr10=  # public EdDSA key, not a secret; gitleaks:allow
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: "O Wisp lê e cria os compromissos da sua agenda quando você pede."
        NSRemindersFullAccessUsageDescription: "O Wisp lê e cria os seus lembretes quando você pede."
        NSAppleEventsUsageDescription: "O Wisp mostra e controla a música que está tocando no Spotify ou no Music."
